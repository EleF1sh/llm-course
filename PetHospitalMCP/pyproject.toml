[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "Stateless MCP adapter for the Pet Hospital Go REST API (stage-1: list_pets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "starlette>=0.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
